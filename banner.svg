<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#16324F"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Formas geométricas decorativas (verde musgo) -->
  <rect x="-40" y="-40" width="140" height="140" fill="#6B8E23" opacity="0.9" transform="rotate(45 30 30)"/>
  <rect x="60" y="180" width="100" height="100" fill="#556B2F" opacity="0.85" transform="rotate(45 110 230)"/>
  <rect x="1080" y="-30" width="130" height="130" fill="#556B2F" opacity="0.9" transform="rotate(45 1145 35)"/>
  <rect x="1000" y="190" width="90" height="90" fill="#6B8E23" opacity="0.85" transform="rotate(45 1045 235)"/>
  <rect x="950" y="30" width="60" height="60" fill="#ffffff" opacity="0.12" transform="rotate(45 980 60)"/>
  <rect x="150" y="20" width="50" height="50" fill="#ffffff" opacity="0.12" transform="rotate(45 175 45)"/>

  <!-- Franja central para el texto -->
  <rect x="0" y="95" width="1200" height="110" fill="#050d1a" opacity="0.3"/>

  <!-- Texto principal -->
  <text x="600" y="150" font-family="Verdana, Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">
    @minortorres161-tech
  </text>

  <!-- Resaltado tipo marcador detrás del texto -->
  <rect x="360" y="175" width="480" height="34" fill="#6B8E23" opacity="0.55" rx="4"/>

  <text x="600" y="195" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Nito Torres · Estudiante Full Stack
  </text>

  <text x="600" y="228" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#dfe9f2" text-anchor="middle">
    Python · Desarrollo Web · Conquer Blocks
  </text>
</svg>
